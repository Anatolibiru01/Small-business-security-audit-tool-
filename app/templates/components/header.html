<!-- TOP DESKTOP SOFTWARE MENU BAR -->
<div class="menu-bar">
  <div class="menu-left-section" id="menuLeftSection">
    <!-- Brand Logo as Menu Trigger Button -->
    <button type="button" class="menu-brand-btn hamburger-menu" id="menuHamburger"
      title="Open Navigation Menu (Click or Hover Left Edge)" aria-label="Open Navigation Menu" tabindex="0">
      <img src="/static/img/logo.png" alt="Lynislens Logo" class="brand-logo">
      <span class="brand-title">Lynislens</span>
      <span class="brand-badge">ENTERPRISE</span>
    </button>

    <!-- Direct Raw Export Action Button -->
    <button type="button" id="btnTopExportRaw" class="btn-menu-action"
      title="Export Raw Lynis /var/log/lynis-report.dat file">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Export Raw (.dat)
    </button>

    <!-- Quick Command Palette Spotlight Trigger Button -->
    <button type="button" id="btnOpenCmdPalette" class="btn-menu-action btn-cmd-spotlight-trigger"
      title="Quick Search & Navigation (Ctrl+K)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Command Palette</span>
      <kbd class="cmd-kbd">Ctrl+K</kbd>
    </button>
  </div>

  <!-- Right Menu Section: Profile & Logout -->
  <div class="menu-right-section">
    <div class="profile-privilege-pill" id="profilePill" role="button" tabindex="0" aria-haspopup="true"
      aria-expanded="false" title="Auditor Profile & Role Privilege">
      <span class="profile-avatar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
      <div class="profile-details">
        <span class="profile-name" id="userProfileName">SecOps Auditor</span>
        <span class="profile-role" id="userProfileRole">Enterprise Security Lead</span>
      </div>
      <svg class="profile-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <!-- User Profile Dropdown Menu -->
    <div id="profileDropdownMenu" class="profile-dropdown-menu" style="display: none;">
      <div class="profile-dropdown-header">
        <div class="profile-header-avatar" id="dropdownAvatar">SA</div>
        <div class="profile-header-text">
          <span class="profile-header-name" id="dropdownUserName">SecOps Auditor</span>
          <span class="profile-header-role" id="dropdownUserRole">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10"></circle>
            </svg>
            Enterprise Security Lead
          </span>
          <span class="profile-header-badge">SUPERADMIN • ROOT ACCESS</span>
        </div>
      </div>
      <div class="profile-dropdown-items">
        <button type="button" class="profile-dropdown-item" id="dropdownGoSettings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span>Profile & Security Settings</span>
        </button>
        <button type="button" class="profile-dropdown-item" id="dropdownChangePassword">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Change Master Password</span>
        </button>
        <button type="button" class="profile-dropdown-item" id="dropdownGoSystems">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
          <span>Managed Infrastructure Assets</span>
        </button>
        <button type="button" class="profile-dropdown-item" id="dropdownGoHistory">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Audit Run History</span>
        </button>
        <div class="profile-dropdown-divider"></div>
        <button type="button" class="profile-dropdown-item item-danger" id="dropdownLogout">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out (Lock Session)</span>
        </button>
      </div>
    </div>

    <!-- Theme Switcher (Dark Mode / Light Mode Toggle) -->
    <button type="button" id="btnThemeToggle" class="btn-theme-toggle" title="Toggle Dark / Light Theme"
      aria-label="Toggle Theme">
      <!-- Sun Icon (shown in dark mode) -->
      <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon Icon (shown in light mode) -->
      <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>
</div>

<!-- ACTIVE MODULE BREADCRUMB / HEADER STRIP (BELOW TOP NAV) -->
<div class="active-module-strip">
  <div class="module-breadcrumb">
    <span class="breadcrumb-root">SUITE MODULE</span>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-active" id="currentModuleTitle">
      <span id="currentModuleName">Dashboard & Executive Summary</span>
    </span>
  </div>
  <div class="module-status-indicator" id="currentModuleDesc">
    Real-Time Linux Hardening Intelligence & Security Posture
  </div>
</div>
