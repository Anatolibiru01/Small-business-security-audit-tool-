<!-- MODAL: Scan Launch Confirmation -->
<div id="scanModal" class="modal-overlay">
  <div class="modal-window">
    <div class="modal-header">
      <h3>Execute Privileged Security Audit</h3>
      <button id="btnCloseScanModal" class="btn-close">&times;</button>
    </div>
    <form id="scanForm">
      <div class="modal-body">
        <div class="target-server-card">
          <div class="target-card-header">
            <strong id="modalTargetServerName">Local Machine (Default)</strong>
            <span id="modalTargetServerBadge" class="badge-status status-checking">Target Active</span>
          </div>
          <div class="target-card-host" id="modalTargetServerHost">127.0.0.1 (Local Execution)</div>
          <div class="target-card-meta" id="modalPreflightMsg">Lynis requires root privileges to audit system
            configuration.</div>
        </div>

        <div class="form-group" id="scanUserGroup">
          <label for="sudoUsername">Local Execution User</label>
          <input type="text" id="sudoUsername" class="form-input" value="root">
        </div>
        <div class="form-group" id="scanPassGroup">
          <label for="sudoPassword">Sudo Password <span style="font-weight:normal; color:var(--text-muted);">(if
              needed)</span></label>
          <input type="password" id="sudoPassword" class="form-input" placeholder="Enter sudo password">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btnCancelScan" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Start Audit Now</button>
      </div>
    </form>
  </div>
</div>
