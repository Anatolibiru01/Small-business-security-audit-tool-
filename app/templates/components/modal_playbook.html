<!-- MODAL: Batch Remediation Playbook Generator -->
<div id="playbookModal" class="modal-overlay">
  <div class="modal-window" style="width: 750px; max-width: 95vw;">
    <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        <h3 style="margin:0; font-size:14px;">Automated Batch Remediation Playbook</h3>
      </div>
      <button id="btnClosePlaybookModal" class="btn-close">&times;</button>
    </div>
    <div class="modal-body" style="padding: 15px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-size:12px; color:var(--text-muted);" id="playbookSummaryText">Compiled executable shell
          script for selected findings.</span>
        <div style="display:flex; gap:6px;">
          <button type="button" id="btnPlaybookFormatSh" class="btn btn-sm btn-secondary active"
            style="font-size:10.5px; padding: 2px 8px;">Shell (.sh)</button>
          <button type="button" id="btnPlaybookFormatAnsible" class="btn btn-sm btn-secondary"
            style="font-size:10.5px; padding: 2px 8px;">Ansible (.yml)</button>
        </div>
      </div>
      <div class="playbook-code-container"
        style="background:#0f172a; border-radius:6px; padding:12px; position:relative;">
        <pre id="playbookCodeViewer"
          style="color:#38bdf8; font-family:var(--font-mono); font-size:11.5px; line-height:1.45; max-height:350px; overflow-y:auto; margin:0; white-space:pre-wrap;"></pre>
      </div>
    </div>
    <div class="modal-footer" style="display:flex; justify-content:space-between; align-items:center;">
      <button type="button" id="btnDownloadPlaybook" class="btn btn-secondary btn-sm">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Download Script
      </button>
      <div style="display:flex; gap:8px;">
        <button type="button" id="btnClosePlaybook" class="btn btn-secondary">Close</button>
        <button type="button" id="btnCopyPlaybook" class="btn btn-primary btn-copy-cmd">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span>Copy Full Playbook</span>
        </button>
      </div>
    </div>
  </div>
</div>
