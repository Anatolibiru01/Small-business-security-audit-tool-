<!-- MODAL: Change Master Password -->
<div id="changePasswordModal" class="modal-overlay">
  <div class="modal-window" style="width: 460px;">
    <div class="modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <h3 style="margin:0; font-size:14px;">Change Master Access Password</h3>
      </div>
      <button id="btnCloseChangePasswordModal" class="btn-close">&times;</button>
    </div>
    <form id="changePasswordForm">
      <div class="modal-body" style="padding: 16px;">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
          Update the master administrative password required to unlock and operate Lynislens.
        </p>
        <div class="form-group">
          <label for="currentMasterPassword">Current Master Password <span class="required">*</span></label>
          <input type="password" id="currentMasterPassword" class="form-input"
            placeholder="Enter current password (default: lynislens)" required>
        </div>
        <div class="form-group">
          <label for="newMasterPassword">New Master Password <span class="required">*</span></label>
          <input type="password" id="newMasterPassword" class="form-input"
            placeholder="Enter new password (min 6 characters)" minlength="6" required>
        </div>
        <div class="form-group">
          <label for="confirmMasterPassword">Confirm New Password <span class="required">*</span></label>
          <input type="password" id="confirmMasterPassword" class="form-input" placeholder="Re-enter new password"
            minlength="6" required>
        </div>
        <div id="changePasswordError"
          style="display: none; font-size: 11.5px; color: #ef4444; margin-top: 6px; font-weight: 600;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btnCancelChangePassword" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="btnSubmitChangePassword" class="btn btn-primary">Update Master Password</button>
      </div>
    </form>
  </div>
</div>
