<!-- LEFT SIDEBAR DRAWER MENU (Always statically docked on the left, expands on hover) -->
<aside id="leftSidebarDrawer" class="left-sidebar-drawer" aria-label="Suite Navigation Drawer">
  <div class="drawer-header">
    <div class="brand-container">
      <img src="/static/img/logo-square.png" alt="Lynislens" class="drawer-brand-logo">
      <div class="brand-title-wrap">
        <span class="brand-title">Lynislens</span>
        <span class="brand-badge">ENTERPRISE</span>
      </div>
    </div>
    <button type="button" id="btnCloseDrawer" class="drawer-btn-close" aria-label="Close navigation drawer" title="Close Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="drawer-body" role="menu" aria-label="Suite Modules">
    <div class="drawer-section-title">SUITE MODULES</div>

    <div class="drawer-item active" data-target-tab="tabDashboard" data-subview="executive" tabindex="0" role="menuitem"
      aria-label="Dashboard & Overview" title="Dashboard & Overview">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
      </div>
      <span class="drawer-item-label">Dashboard & Overview</span>
    </div>

    <div class="drawer-item" data-target-tab="tabSystems" tabindex="0" role="menuitem" aria-label="Agent Overview"
      title="Agent Overview">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
          <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
          <line x1="6" y1="6" x2="6.01" y2="6"></line>
          <line x1="6" y1="18" x2="6.01" y2="18"></line>
        </svg>
      </div>
      <span class="drawer-item-label">Agent Overview</span>
    </div>

    <div class="drawer-item" data-target-tab="tabCompliance" tabindex="0" role="menuitem" aria-label="Compliance Matrix"
      title="Compliance Matrix">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <span class="drawer-item-label">Compliance Matrix</span>
    </div>

    <div class="drawer-item" data-target-tab="tabImprovement" tabindex="0" role="menuitem" aria-label="Improvement Plan"
      title="Improvement Plan">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <span class="drawer-item-label">Improvement Plan</span>
    </div>

    <div class="drawer-item" data-target-tab="tabReporting" tabindex="0" role="menuitem" aria-label="Reporting Hub"
      title="Reporting Hub">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
      </div>
      <span class="drawer-item-label">Reporting Hub</span>
    </div>

    <div class="drawer-item" data-target-tab="tabSettings" tabindex="0" role="menuitem" aria-label="Suite Settings"
      title="Suite Settings">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
      </div>
      <span class="drawer-item-label">Suite Settings</span>
    </div>

    <!-- DOCUMENTATION & HELP -->
    <div class="drawer-section-title">DOCUMENTATION & HELP</div>

    <div class="drawer-item" id="drawerBtnDoc" tabindex="0" role="menuitem" aria-label="Lynis Documentation"
      title="Lynis Documentation">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      </div>
      <span class="drawer-item-label">Documentation</span>
    </div>

    <div class="drawer-item" id="drawerBtnAbout" tabindex="0" role="menuitem" aria-label="About Lynislens"
      title="About Lynislens">
      <div class="drawer-item-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <span class="drawer-item-label">About Lynislens</span>
    </div>
  </div>

  <div class="drawer-footer">
    <button type="button" id="drawerBtnLogout" class="btn-drawer-logout" tabindex="0" aria-label="Sign Out"
      title="Sign Out">
      <div class="btn-drawer-logout-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <span class="btn-drawer-logout-label">Sign Out of Suite</span>
    </button>
  </div>
</aside>

<!-- Mobile Navigation Drawer Backdrop Overlay -->
<div id="leftDrawerBackdrop" class="left-drawer-backdrop" aria-hidden="true"></div>
